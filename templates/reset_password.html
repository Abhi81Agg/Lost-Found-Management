{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2>Reset Password</h2>

    <form method="POST">

        <div class="form-group">
            <label>New Password</label>

            <input
                type="password"
                class="form-control"
                id="new_password"
                name="password"
                required>

        </div>

        <button class="btn btn-primary">
            Reset Password
        </button>

    </form>

</div>

{% endblock %}
